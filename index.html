<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B0F19" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Stock Radar FR — PS5, Xbox & GTA 6</title>
  <style>
    :root {
      --bg: #0B0F19;
      --card: #131A2A;
      --border: #1E293B;
      --accent: #00E5FF;
      --ok: #10B981;
      --ko: #EF4444;
      --text: #F1F5F9;
      --muted: #94A3B8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px 16px; max-width: 720px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    h1 { font-size: 1.25rem; color: var(--accent); letter-spacing: 0.5px; }
    .update { font-size: 0.8rem; color: var(--muted); }
    .grid { display: grid; gap: 14px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .card.available { border-color: var(--ok); box-shadow: 0 0 16px rgba(16, 185, 129, 0.15); }
    .info h2 { font-size: 1rem; margin-bottom: 4px; }
    .meta { font-size: 0.85rem; color: var(--muted); }
    .actions { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
    .badge { padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; white-space: nowrap; }
    .badge.ok { background: rgba(16, 185, 129, 0.15); color: var(--ok); }
    .badge.ko { background: rgba(239, 68, 68, 0.15); color: var(--ko); }
    a.btn { text-decoration: none; background: var(--accent); color: #0B0F19; font-weight: 700; font-size: 0.8rem; padding: 6px 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <header>
    <h1>STOCK RADAR FR</h1>
    <span class="update" id="last-update">Chargement...</span>
  </header>
  <div class="grid" id="list"></div>

  <script>
    async function loadStocks() {
      try {
        const res = await fetch(`stocks.json?t=${Date.now()}`);
        const data = await res.json();
        const date = new Date(data.updated_at);
        document.getElementById("last-update").textContent =
          "MàJ : " + date.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });

        const list = document.getElementById("list");
        list.innerHTML = data.items.map(item => `
          <div class="card ${item.in_stock ? 'available' : ''}">
            <div class="info">
              <h2>${item.name}</h2>
              <div class="meta">${item.shop} • ${item.type}</div>
            </div>
            <div class="actions">
              <span class="badge ${item.in_stock ? 'ok' : 'ko'}">${item.status}</span>
              <a class="btn" href="${item.url}" target="_blank" rel="noopener">Ouvrir</a>
            </div>
          </div>
        `).join("");
      } catch (e) {
        document.getElementById("last-update").textContent = "En attente du 1er scan...";
      }
    }
    loadStocks();
    setInterval(loadStocks, 60000);
  </script>
</body>
</html>
